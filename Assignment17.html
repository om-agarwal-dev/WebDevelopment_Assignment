<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment17</title>
</head>
<body>
    <form action="/submit-registration" method="post">
        <input type="text" name="fullname" placeholder="Full name" required><br><br>

        <input type="email" name="email" placeholder="you@college.edu" required><br><br>
        
        <input type="tel" name="mobile" placeholder="10-digit mobile" pattern="[0-9]{10}" maxlength="10" required><br><br>
        
        <input type="password" name="password" placeholder="min 6 characters" minlength="6" required><br><br>
        
        <input type="number" name="age" placeholder="Age (17-" min="17" max="60")required><br><br>  
        
        <button type="submit">Register</button>

    </form>
    
</body>
</html>
